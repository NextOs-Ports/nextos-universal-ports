name: Catálogo / Catalog
on:
  workflow_dispatch:
  release:
    types: [published, edited]
  push:
    branches: [main]
    paths: ["buildtools/**", "ports-*/**/*.screenshot.jpg", "catalog/040_nextos.source.json"]
permissions:
  contents: write
concurrency: catalog
jobs:
  catalog:
    runs-on: ubuntu-latest
    if: github.event_name != 'release' || github.event.release.tag_name != 'ports-latest'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Gerar e publicar catálogo
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 buildtools/build_catalog.py --upload
      - name: Commit do ports.json do site
        run: |
          git config user.name "nextos-catalog[bot]"
          git config user.email "nextos-catalog@users.noreply.github.com"
          git add docs/ports.json catalog/ports.json catalog/images.zip
          git diff --cached --quiet || git commit -m "catalog: atualiza ports.json e images.zip"
          git push
